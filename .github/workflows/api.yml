# API: lint and test on every change, deploy the code to the Function App when the owner starts it by hand on main.
# The deploy uses the environment "production": the owner approves the run before it gets an Azure token.
name: api

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12' # the runtime of the Function App
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The name has a hash from Bicep (uniqueString), so it is looked up instead of stored as a variable.
      - id: app
        run: echo "name=$(az functionapp list -g rg-zombies --query "[?tags.\"azd-service-name\"=='api'].name | [0]" -o tsv)" >> "$GITHUB_OUTPUT"
      # Flex Consumption: the package goes to the app-package container, and Azure builds the dependencies.
      # Azure CLI signs in to the deploy endpoint with the Entra ID token from OIDC. Basic auth (user name and
      # password) is turned off on the app, and Azure/functions-action needs it (401 on 2026-11-19).
      - name: Package and deploy
        working-directory: api
        run: |
          zip -q ../api.zip function_app.py rules.py host.json requirements.txt # only what runs in Azure
          az functionapp deployment source config-zip \
            --resource-group rg-zombies \
            --name "${{ steps.app.outputs.name }}" \
            --src ../api.zip \
            --build-remote true
