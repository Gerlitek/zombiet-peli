# Infra: validate the Bicep, then preview and deploy it to the resource group.
# Pull requests and pushes only validate and never log in to Azure.
# The deploy job runs only when the owner starts the workflow by hand on main. It uses
# the environment "production": the owner must approve the run before it gets an Azure token.
# Approving means "I have read the what-if". The owner checks it locally before starting the run.
# Incremental mode only: resources missing from the template are never deleted.
name: infra

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Compiles to ARM JSON and runs the Bicep linter. Fails on errors, not on warnings.
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write # lets this job request an OIDC token from GitHub
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview the change
        run: |
          az deployment group what-if \
            --resource-group rg-zombies \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json
      - name: Deploy
        run: |
          az deployment group create \
            --name "main-${{ github.run_number }}" \
            --resource-group rg-zombies \
            --mode Incremental \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json
