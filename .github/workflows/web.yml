# Front: type check, unit tests, production build and deploy to the web host.
# Pull requests only build and test. The deploy job runs on main, after the owner
# approves the run in the "production" environment.
name: web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # Never cancel a running deploy halfway. Only superseded pull request builds are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # runs tsc --noEmit first
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true # without this .htaccess is left out of the artifact
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The secret lives in this environment. The owner approves each run here.
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Install the deploy key and the pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          # Pinned fingerprint SHA256:iO596IX5WjAaAsu9r19P8b4KFznagt4G425dg4gC4rc.
          # If the host key changes, the deploy fails instead of trusting a stranger.
          echo 'gerlitek.fi ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBikwALrcmKz8x5xbtpWY/UxZ8/XPem34cluLcb0eBGe' > ~/.ssh/known_hosts
      - name: Sync to the web host
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        # The key is restricted on the server (rrsync), so "./" is the game's public folder.
        # --delete removes files from older builds, such as old hashed JS files.
        run: |
          rsync -av --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$DEPLOY_USER@gerlitek.fi:./"
